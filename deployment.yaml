apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: 879772956301.dkr.ecr.us-east-1.amazonaws.com/user134-frontend-repo:latest 
        ports:
        - containerPort: 3000
