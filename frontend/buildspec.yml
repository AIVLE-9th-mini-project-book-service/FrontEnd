version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend && npm ci
  build:
    commands:
      - npm run build
      - cp frontend/appspec.yml appspec.yml
      - cp -r frontend/deploy-scripts deploy-scripts

artifacts:
  files:
    - frontend/dist/**/*
    - frontend/deploy-scripts/**/*
    - appspec.yml
  discard-paths: no

cache:
  paths:
    - frontend/node_modules/**/*