version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd frontend
      - npm ci

  pre_build:
    commands:
      - echo "Pre-build started on `date`"
      - echo "Node version: $(node -v)"
      - echo "NPM version: $(npm -v)"

  build:
    commands:
      - echo "Build started on `date`"
      - cd frontend
      - npm run build

  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
  discard-paths: no
  secondary-artifacts:
    deploy:
      files:
        - appspec.yml
        - scripts/**/*
      base-directory: frontend
      discard-paths: no

cache:
  paths:
    - frontend/node_modules/**/*