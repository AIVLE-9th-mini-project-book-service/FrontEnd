version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend && npm ci
  build:
    commands:
      - npm run build

artifacts:
  files:
    - frontend/dist/**/*
    - frontend/deploy-scripts/**/*
    - frontend/appspec.yml
  discard-paths: yes

cache:
  paths:
    - frontend/node_modules/**/*