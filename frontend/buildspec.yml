version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend && npm ci
  build:
    commands:
      - cd frontend && npm run build && echo "BUILD SUCCESS" || (echo "BUILD FAILED" && cat frontend/package.json && exit 1)

artifacts:
  files:
    - frontend/dist/**/*
    - frontend/appspec.yml
    - frontend/deploy-scripts/**/*
  discard-paths: no

cache:
  paths:
    - frontend/node_modules/**/*