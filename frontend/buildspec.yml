version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend && npm ci
  pre_build:
    commands:
      - echo "Node $(node -v)"
  build:
    commands:
      - cd frontend && npm run build
  post_build:
    commands:
      - echo "Build done"

artifacts:
  files:
    - frontend/dist/**/*
    - frontend/appspec.yml
    - frontend/deploy-scripts/**/*
  discard-paths: no

cache:
  paths:
    - frontend/node_modules/**/*